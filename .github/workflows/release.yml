name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/mdv-macos-arm64 .
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/mdv-linux-x86_64 .
          cd dist
          sha256sum mdv-macos-arm64 mdv-linux-x86_64 > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mdv-macos-arm64 \
            dist/mdv-linux-x86_64 \
            dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
